label: "Uçak Bileti"

# Kaynak: obilet.com — window.ob.page.model.bottomTable.data (aynı yapı, bus ile özdeş)
# URL: https://www.obilet.com/ucak-bileti/{origin_slug}-{dest_slug}?date=DD.MM.YYYY
# Tarih: bugün + 7 gün (dinamik hesaplanır)
# Kayıt: rota başına TÜM firmalar (Pegasus, AJet, THY, Lufthansa, KLM...)
#
# NOT: JFK (New York) obilet'te mevcut değil → Dubai (DXB) ile ikame edildi.

categories:

  # ── Yurt içi ──────────────────────────────────────────────────────────────
  istanbul_antalya:
    label: İstanbul — Antalya
    tuik_codes:
      - "073201"   # Hava yolu bileti (yurt içi)
