label: "Şehirlerarası Otobüs"

# Takip edilen operatörler — bu listeden başka firma eklenmez.
tracked_operators:
  - ali_osman_ulusoy
  - metro_turizm
  - kamil_koc
  - pamukkale_turizm

# Her kategori bir güzergah (origin → destination).
# Her gün, takip edilen her operatör için economy sınıfı minimum fiyatı çekilir.
# Tarihi scraper yönetir (yarın); url alanındaki date parametresi override edilir.

categories:
  istanbul_ankara:
    label: İstanbul — Ankara
    tuik_codes:
      - "073221"   # Şehirlerarası otobüs bileti ücreti
    sources:
      obilet:
        origin_city: istanbul
        dest_city: ankara
        url: "https://obilet.com/otobus-bileti/istanbul-ankara"
      biletall:
        origin_city: istanbul
        dest_city: ankara
        url: "https://www.biletall.com/otobus-bileti/istanbul-ankara"

