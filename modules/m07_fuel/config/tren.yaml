label: "Tren"

# Her kategori bir güzergah (origin → destination).
# Kaynak: ebilet.tcddtasimacilik.gov.tr
# API: POST /tms/train/train-availability (JWT Bearer, Playwright üzerinden)
# Tarih: scraper "Yarın" butonunu tıklar.
# İstasyon eşlemeleri: tcddbilet.py içindeki _STATION_TERMS dict'i.
#
# İstanbul-İzmir doğrudan YHT hattı yok — bu güzergah kapsam dışı.

