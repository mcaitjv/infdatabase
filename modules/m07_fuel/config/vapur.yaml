label: "Vapur & Deniz Otobüsü"

# Strateji: hibrit
#   1. Her route için scrape dene
#   2. Scrape başarısız (0 kayıt veya hata) → snapshot kullan
#   3. İzdeniz fiyatları resme gömülü → her zaman snapshot

# Snapshot: operatör doğrulamış değerler (ücretler değişince elle güncelle)
snapshot:
  last_updated: "2026-05-01"   # scraper başarısız olursa fallback
  routes:
    sehirhatlari_kent_ici:
      tam_bilet:     59.28
      ogrenci:       28.87
    ido_istanbul_yalova:
      tam_bilet:     49.39
      ogrenci:       24.32
    budo_bursa_istanbul:
      tam_bilet:     1250.00
      ogrenci:       900.00

# Bilet kategorileri (TÜİK COICOP: 0734001 = Vapur bileti ücreti)
categories:
  tam_bilet:
    label: Tam Bilet
    tuik_codes: ["0734001"]
  ogrenci:
    label: Öğrenci Bileti
    tuik_codes: ["0734001"]
  aylik_abonman:
    label: Aylık Abonman
    tuik_codes: ["0734001"]

# Operatör + rota tanımları
routes:
  sehirhatlari_kent_ici:
    label: "İstanbul Şehir Hatları (Karaköy-Kadıköy temsili)"
    operator: sehirhatlari
    city: istanbul
    source:
      url: "https://sehirhatlari.istanbul/tr/ucret-tarifeleri"
      scrape_method: static_html
    # Aylık abonman bu sayfada yok — sadece tek-yön ücretler tutulur
    categories: [tam_bilet, ogrenci]

  ido_istanbul_yalova:
    label: "İDO İstanbul-Yalova"
    operator: ido
    city: istanbul
    source:
      url: "https://www.ido.com.tr/tr/tarife/ucret-tarifesi"
      scrape_method: playwright
    categories: [tam_bilet, ogrenci]

  budo_bursa_istanbul:
    label: "BUDO Bursa-İstanbul (Mudanya-Eminönü)"
    operator: budo
    city: bursa
    source:
      url: "https://budo.burulas.com.tr/tr/Budo/TicketPrice"
      scrape_method: playwright
    categories: [tam_bilet, ogrenci]
